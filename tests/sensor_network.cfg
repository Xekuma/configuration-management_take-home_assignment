=begin
Конфигурация системы промышленного мониторинга:
порты шлюзов, интервалы опроса (мс) и пороги температуры (C).
=end

-- Сетевые параметры
def base_port: 5000;
def backup_port: 5001;
def poll_interval_ms: 250;

-- Допустимые диапазоны температуры [мин, макс]
def cold_zone: array(-40, +5);
def hot_zone: array(+15, +85);

-- Калибровочные поправки для датчиков
def calibration_offsets: array(-2, 0, +3);

array(
    array(! {base_port}, ! {backup_port}),
    ! {poll_interval_ms},
    array(! {cold_zone}, ! {hot_zone}),
    ! {calibration_offsets}
)